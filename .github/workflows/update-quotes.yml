name: Kurse aktualisieren

on:
  schedule:
    - cron: '15 6,12,17,21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  abrufen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kursdaten holen und Kennzahlen berechnen
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-quotes.mjs

      - name: Ergebnis committen
        run: |
          git config user.name "watchlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --quiet --cached; then
            echo "Keine Änderung an den Kursdaten."
          else
            git commit -m "Kursdaten $(date -u '+%d.%m.%Y %H:%M UTC')"
            git push
          fi
