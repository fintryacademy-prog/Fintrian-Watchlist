name: Zeitplan wachhalten

# GitHub schaltet geplante Abläufe in Repositories ab, die 60 Tage lang keine
# Aktivität zeigen. Dieser Ablauf schreibt monatlich einen Zeitstempel und
# pusht ihn, bevorzugt mit einem persönlichen Zugriffstoken im Secret
# KEEPALIVE_TOKEN, ersatzweise mit dem Standardtoken.

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wachhalten:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.KEEPALIVE_TOKEN || github.token }}

      - name: Zeitstempel schreiben
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > data/keepalive.txt
          git config user.name "watchlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/keepalive.txt
          git commit -m "Zeitplan wachgehalten"
          git push
